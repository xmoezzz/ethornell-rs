[workspace]
members = [
  "crates/game-network",
  "crates/ethornell-core",
  "crates/ethornell-archive",
  "crates/ethornell-image",
  "crates/ethornell-script",
  "crates/ethornell-vm",
  "crates/ethornell-render",
  "crates/ethornell-audio",
  "crates/ethornell-app",
  "crates/ethornell-mobile",
  "crates/ethornell-web",
  "crates/ethornell-cli",
  "crates/na_mpeg2_decoder",
  "crates/na_wmv_player",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = ""

[workspace.lints.clippy]
# Preserve explicit offsets and row/column formulas in indexed data layouts.
identity_op = "allow"
erasing_op = "allow"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
byteorder = "1"
encoding_rs = "0.8"
# Native renderers and Flash share one wgpu generation. Target crates select
# native backends or browser WebGL2/WebGPU without duplicate WebGPU bindings.
wgpu = { version = "=30.0.1", default-features = false, features = ["wgsl"] }
winit = "0.31.0-beta.3"
kira = "0.8"
pollster = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
bytemuck = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
