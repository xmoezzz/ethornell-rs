name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config
      - name: Build
        run: cargo build --release --locked -p ethornell-cli --bin ethornell
      - name: Package
        run: |
          mkdir -p dist
          test -f target/release/ethornell
          tar -C target/release -czf dist/ethornell-linux-${{ matrix.arch }}.tar.gz ethornell
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-linux-${{ matrix.arch }}
          path: dist/ethornell-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  freebsd:
    name: FreeBSD (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.4"
          arch: x86_64
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            set -e
            pkg update
            pkg install -y git curl rust pkgconf cmake gmake alsa-lib openjdk17 \
              libX11 libXcursor libXi libXrandr libxcb wayland libxkbcommon vulkan-loader
          run: |
            set -e
            # ruffle_core's build script compiles its ActionScript library with Java.
            export JAVA_HOME=/usr/local/openjdk17 PATH=/usr/local/openjdk17/bin:$PATH
            freebsd-version
            rustc -V
            cargo build --release --locked -p ethornell-cli --bin ethornell
            mkdir -p dist
            test -f target/release/ethornell
            tar -C target/release -czf dist/ethornell-freebsd-x86_64.tar.gz ethornell
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-freebsd-x86_64
          path: dist/ethornell-freebsd-x86_64.tar.gz
          if-no-files-found: error

  vita_image:
    name: PS Vita build image
    uses: ./.github/workflows/vita-image.yml
    permissions:
      contents: read
      packages: write

  vita:
    name: PS Vita (VPK)
    needs: vita_image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    # VitaSDK, libvita2d, the pinned nightly and cargo-vita
    # (platform/vita/docker/Dockerfile).
    container:
      image: ${{ needs.vita_image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform/vita/player
      - name: Build VPK
        run: |
          set -euo pipefail
          cd platform/vita/player
          cargo vita build vpk -- --release
          mkdir -p ../../../dist
          cp target/armv7-sony-vita-newlibeabihf/release/ethornell_vita.vpk ../../../dist/ethornell-psvita.vpk
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-psvita
          path: dist/ethornell-psvita.vpk
          if-no-files-found: error

  switch_image:
    name: Switch build image
    uses: ./.github/workflows/switch-image.yml
    permissions:
      contents: read
      packages: write

  switch:
    name: Nintendo Switch (NRO)
    needs: switch_image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: read
    # devkitA64, libnx, deko3d, uam and the pinned nightly
    # (platform/switch/docker/Dockerfile).
    container:
      image: ${{ needs.switch_image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build NRO
        run: |
          set -euo pipefail
          make -C platform/switch/runtime
          mkdir -p dist
          cp platform/switch/runtime/ethornell_switch.nro dist/ethornell-switch.nro
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-switch
          path: dist/ethornell-switch.nro
          if-no-files-found: error

  macos:
    name: macOS (universal app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build Ethornell.app
        run: platform/macos/package.sh
      - name: Package
        run: |
          mkdir -p dist
          cp target/macos/Ethornell-macos.zip dist/ethornell-macos-universal.zip
          tar -C target/macos/Ethornell.app/Contents/MacOS -czf dist/ethornell-macos-universal.tar.gz ethornell
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-macos-universal
          path: |
            dist/ethornell-macos-universal.zip
            dist/ethornell-macos-universal.tar.gz
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        # A debug-signed APK: installable as is. Each CI machine has its own
        # debug key, so updating needs an uninstall first (saves are lost).
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          platform/android/build.sh
      - name: Package
        run: |
          mkdir -p dist
          cp platform/android/app/build/outputs/apk/debug/app-debug.apk dist/ethornell-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-android
          path: dist/ethornell-android.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build IPA
        run: platform/ios/build.sh device
      - name: Package
        run: |
          mkdir -p dist
          cp platform/ios/build/Ethornell-unsigned.ipa dist/ethornell-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-ios
          path: dist/ethornell-ios-unsigned.ipa
          if-no-files-found: error

  web:
    name: Web (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: platform/wasm/build.sh
      - name: Package
        run: |
          mkdir -p dist
          (cd build/wasm && zip -r ../../dist/ethornell-web.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-web
          path: dist/ethornell-web.zip
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p ethornell-cli --bin ethornell
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          if (-not (Test-Path target/release/ethornell.exe)) { throw 'ethornell.exe was not built' }
          Compress-Archive -Path target/release/ethornell.exe -DestinationPath dist/ethornell-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ethornell-windows-x86_64
          path: dist/ethornell-windows-x86_64.zip
          if-no-files-found: error

  rolling:
    name: Publish rolling prerelease
    # Only main replaces the public pre-release; other branches just build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux, freebsd, macos, windows, android, ios, web, vita, switch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ethornell-rolling-release
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          files=(dist/ethornell-linux-{x86_64,aarch64}.tar.gz
                 dist/ethornell-freebsd-x86_64.tar.gz
                 dist/ethornell-macos-universal.{zip,tar.gz}
                 dist/ethornell-windows-x86_64.zip
                 dist/ethornell-android.apk
                 dist/ethornell-ios-unsigned.ipa
                 dist/ethornell-web.zip
                 dist/ethornell-psvita.vpk
                 dist/ethornell-switch.nro)
          for file in "${files[@]}"; do test -f "$file"; done

          if gh release view pre-release >/dev/null 2>&1; then
            gh release delete pre-release --cleanup-tag --yes
          fi

          gh release create pre-release "${files[@]}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "ethornell rolling (${GITHUB_SHA::7})" \
            --notes "Rolling build from commit $GITHUB_SHA."

  release:
    name: Publish versioned release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, freebsd, macos, windows, android, ios, web, vita, switch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
