[package]
name = "ethornell-audio"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
ethornell-core = { path = "../ethornell-core" }
serde.workspace = true
# Enables Symphonia's MPEG-1/2 Layer II decoder for kira, whose own features
# stop at MP3 (BGI movies carry Layer II soundtracks), and decodes BGM pairs
# while they play (streamed.rs).
symphonia = { version = "0.5.5", default-features = false, features = ["mp2"] }

[target.'cfg(not(any(target_os="vita",target_os="horizon")))'.dependencies]
kira.workspace = true
[target.'cfg(any(target_os="vita",target_os="horizon"))'.dependencies]
kira = { version = "0.8", default-features = false, features = ["mp3", "ogg", "flac", "wav"] }
