[package]
name = "ethornell-render"
version = "0.1.0"
edition.workspace = true

[lints]
workspace = true

[features]
default = ["desktop-window"]
desktop-window = ["dep:winit"]
native-gpu = []

[dependencies]
ethornell-core = { path = "../ethornell-core" }
tracing.workspace = true
bytemuck.workspace = true
ethornell-image = { path = "../ethornell-image" }
ab_glyph.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
web-sys = { version = "0.3", features = ["OffscreenCanvas"] }

[target.'cfg(not(any(target_arch = "wasm32",target_os="vita",target_os="horizon")))'.dependencies.wgpu]
workspace = true
features = ["dx12", "metal", "webgpu"]

[target.'cfg(not(any(target_os="vita",target_os="horizon")))'.dependencies]
winit = { workspace = true, optional = true }
raw-window-handle = "0.6"
